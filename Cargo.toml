[workspace]
resolver = "3"
members = [
    "synaptics-core",
    "synaptics-proto",
    "synaptics-transport",
    "synaptics-crypto",
    "synaptics-biometric",
    "synaptics-prometheus",
    "synaptics-prometheus-qm",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"

[workspace.dependencies]
thiserror = "2"
bitflags = "2"
log = "0.4"
p256 = { version = "0.14", features = ["ecdh", "ecdsa"] }
rand_core = "0.10"
getrandom = "0.4"
sha2 = "0.11"
aes = "0.9"
cbc = { version = "0.2", features = ["alloc"] }
hmac = "0.13"
nusb = "0.1"
pollster = "1"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
png = "0.18"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
